<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4096ff"/>
      <stop offset="100%" stop-color="#1677ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="8" y1="10" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#69b1ff"/>
      <stop offset="100%" stop-color="#4096ff"/>
    </linearGradient>
  </defs>
  <!-- rounded square background -->
  <rect width="40" height="40" rx="10" fill="url(#g1)"/>
  <!-- kanban board: 3 columns -->
  <rect x="6" y="10" width="8" height="20" rx="2" fill="#fff" opacity=".92"/>
  <rect x="16" y="10" width="8" height="20" rx="2" fill="#fff" opacity=".92"/>
  <rect x="26" y="10" width="8" height="20" rx="2" fill="#fff" opacity=".92"/>
  <!-- column 1: 2 cards -->
  <rect x="8" y="13" width="4" height="3" rx="0.8" fill="url(#g2)"/>
  <rect x="8" y="18" width="4" height="3" rx="0.8" fill="#91caff" opacity=".7"/>
  <!-- column 2: 2 cards + check -->
  <rect x="18" y="13" width="4" height="3" rx="0.8" fill="#ffc069"/>
  <rect x="18" y="18" width="4" height="3" rx="0.8" fill="#91caff" opacity=".7"/>
  <circle cx="20" cy="25.5" r="2" fill="#52c41a"/>
  <path d="M19 25.5l1 1 2-2" stroke="#fff" stroke-width=".8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- column 3: 1 card + star (offer) -->
  <rect x="28" y="13" width="4" height="3" rx="0.8" fill="#52c41a"/>
  <circle cx="30" cy="22" r="2.8" fill="#ffd666"/>
  <path d="M30 19.8l.7 1.4 1.5.2-1.1 1 .3 1.5L30 23.3l-1.4.8.3-1.5-1.1-1 1.5-.2z" fill="#fff"/>
</svg>
